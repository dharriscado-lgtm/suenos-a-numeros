name: Generar APK Android
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Extraer proyecto Android
        run: unzip -q suenos-a-numeros-android-V3.6-FINAL-853x1844.zip -d android-project
      - name: Generar wrapper
        working-directory: android-project
        run: gradle wrapper --gradle-version 8.13
      - name: Compilar APK
        working-directory: android-project
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: suenos-a-numeros-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
