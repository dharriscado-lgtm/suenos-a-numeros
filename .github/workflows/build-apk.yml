name: Generar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Encontrar y extraer proyecto Android
        run: |
          mkdir -p android-project
          ZIP=$(find . -maxdepth 1 -type f -name '*android-V3*.zip' | head -n 1)
          echo "ZIP encontrado: $ZIP"
          unzip -q "$ZIP" -d android-project

      - name: Encontrar carpeta del proyecto
        run: |
          PROJECT_DIR=$(find android-project -name settings.gradle -type f -print -quit | xargs dirname)
          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generar wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle wrapper --gradle-version 8.13

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: suenos-a-numeros-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
